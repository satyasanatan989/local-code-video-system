<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kinetic Typography Sequence - GSAP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@700&family=Rozha+One&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1A1829 0%, #08060D 100%);
      color: #fff;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .badge {
      font-family: 'Cinzel', serif;
      font-size: 32px;
      color: #D4AF37;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 12px 36px;
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 40px;
      margin-bottom: 50px;
      opacity: 0;
      transform: translateY(-30px);
    }
    .line-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 160px;
      line-height: 0.95;
      color: #FFFFFF;
      text-align: center;
      letter-spacing: 0.05em;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
    }
    .line-gold {
      color: #FFD700;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
    }
    .line-sub {
      font-family: 'Rozha One', serif;
      font-size: 64px;
      color: #E2E8F0;
      margin-top: 40px;
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
    }
    .word { display: inline-block; opacity: 0; transform: translateY(60px); }
    .grid-lines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="badge" id="badge">✦ THE ARCHITECTURE OF POWER ✦</div>
  <div class="line-main" id="headline">
    <span class="word" id="w1">EVERY</span>
    <span class="word" id="w2">EMPIRE</span><br>
    <span class="word line-gold" id="w3">RISES</span>
    <span class="word" id="w4">ON</span>
    <span class="word line-gold" id="w5">TRUTH</span>
  </div>
  <div class="line-sub" id="subtext">"Knowledge is the only unconquerable fortress."</div>

  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.to("#badge", { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2)
      .to("#w1", { opacity: 1, y: 0, duration: 0.6, ease: "back.out(2)" }, 0.8)
      .to("#w2", { opacity: 1, y: 0, duration: 0.6, ease: "back.out(2)" }, 1.2)
      .to("#w3", { opacity: 1, y: 0, duration: 0.8, scale: 1.1, ease: "elastic.out(1, 0.5)" }, 1.8)
      .to("#w4", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.4)
      .to("#w5", { opacity: 1, y: 0, duration: 0.9, scale: 1.15, ease: "elastic.out(1.2, 0.4)" }, 2.8)
      .to("#subtext", { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 3.5);

    window.setSeekTime = function(t) {
      tl.seek(t);
    };
  </script>
</body>
</html>
