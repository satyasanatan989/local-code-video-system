<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synchronized Local Voiceover & Whisper Subtitles</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=JetBrains+Mono:wght@700&family=Marcellus&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at center, #1E1A17 0%, #0D0A08 100%);
      color: #fff;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Marcellus', serif;
      position: relative;
    }
    .badge-top {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 0.15em;
      color: #D4AF37;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 10px 32px;
      border-radius: 30px;
      margin-bottom: 60px;
      background: rgba(212, 175, 55, 0.08);
    }
    .waveform-visualizer {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 4px solid #D4AF37;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 80px;
      position: relative;
      box-shadow: 0 0 50px rgba(212, 175, 55, 0.25);
    }
    .waveform-visualizer::after {
      content: '🎙️';
      font-size: 90px;
    }
    .subtitle-card {
      width: 880px;
      background: rgba(20, 16, 14, 0.85);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    .subtitle-text {
      font-size: 42px;
      line-height: 1.6;
      color: #CBD5E0;
    }
    .word-active {
      color: #FFD700 !important;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      background: rgba(255, 215, 0, 0.15);
      padding: 2px 8px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="badge-top">WHISPER WORD-LEVEL SYNC</div>
  <div class="waveform-visualizer" id="vis"></div>
  <div class="subtitle-card">
    <div class="subtitle-text" id="sub-display">Loading voiceover transcript...</div>
  </div>

  <script>
    let words = [];
    fetch('whisper_words.json')
      .then(r => r.json())
      .then(data => {
        words = data.words || [];
        renderInitialText();
      })
      .catch(() => {
        // Fallback words
        words = [
          { word: "Kabhi", start: 0.1, end: 0.5 },
          { word: "bhi", start: 0.5, end: 0.8 },
          { word: "upar", start: 0.8, end: 1.2 },
          { word: "dekhte", start: 1.2, end: 1.8 },
          { word: "hoge", start: 1.8, end: 2.3 },
          { word: "to", start: 2.3, end: 2.6 },
          { word: "aapko", start: 2.6, end: 3.1 },
          { word: "sooraj", start: 3.1, end: 3.6 },
          { word: "dikhta", start: 3.6, end: 4.2 },
          { word: "hoga...", start: 4.2, end: 5.0 }
        ];
        renderInitialText();
      });

    function renderInitialText() {
      const container = document.getElementById('sub-display');
      container.innerHTML = words.map((w, i) => `<span id="word-${i}" class="word-span">${w.word}</span>`).join(' ');
    }

    window.setSeekTime = function(t) {
      words.forEach((w, i) => {
        const el = document.getElementById(`word-${i}`);
        if (!el) return;
        if (t >= w.start && t <= w.end) {
          el.className = 'word-span word-active';
        } else {
          el.className = 'word-span';
        }
      });

      // Pulse visualizer
      const pulse = 1.0 + 0.12 * Math.sin(t * 8);
      document.getElementById('vis').style.transform = `scale(${pulse})`;
    };
  </script>
</body>
</html>
